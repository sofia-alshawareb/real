# DINO image-level binary classifier (0 = fragmented, 1 = uniform).
# Duplicate this file for ablation runs and change only the fields you want to test.

model:
  dino_repo: data/models/dinov2
  dino_weights: data/models/checkpoints/dinov2_vits14_reg4_pretrain.pth
  num_blocks: 12          # ViT-S/14 has 12 blocks; use fewer for faster experiments
  embed_dim: 384          # ViT-S/14 feature dimension
  freeze_dino: true       # train head only; set false to fine-tune backbone

head:
  type: structure           # structure | gap_linear | gap_mlp
  conv_channels: [128, 128, 64]   # structure only
  kernel_size: 3
  mlp_hidden: 64
  dropout: 0.2
  # Subset of {mean, max, std} — controls which global pools feed the MLP
  pooling: [mean, max, std]

data:
  root: data/classification
  train_dir: train
  val_dir: val
  image_size: 518         # divisible by DINO patch size 14 → 37×37 tokens
  augment: true

training:
  batch_size: 8
  epochs: 30
  lr: 0.001
  weight_decay: 0.01
  num_workers: 4
  seed: 0
  device: ""              # empty = cuda if available else cpu

output:
  dir: outputs/dino_image_classifier
  experiment_name: default
